# Образ = CI_REGISTRY_IMAGE в GitLab. Пример: PATCHBOT_IMAGE=192.168.1.108:5051/ism/patchbot:latest
services:
  bot:
    image: ${PATCHBOT_IMAGE:-192.168.1.108:5051/ism/patchbot:latest}
    build: .
    container_name: patchbot
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    environment:
      HTTP_PROXY: "http://127.0.0.1:10808"
      HTTPS_PROXY: "http://127.0.0.1:10808"
      PROXY_URL: "http://127.0.0.1:10808"
    volumes:
      - ./data:/app/data
