# Образ в registry = CI_REGISTRY_IMAGE. На RPI в .env при необходимости PATCHBOT_IMAGE.
# HTTP registry без TLS: логин только на http://… и insecure-registry у dind (см. build_job).
variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    LATEST_IMAGE: "$CI_REGISTRY_IMAGE:latest"
    DEPLOY_SSH_HOST: "192.168.1.107"
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    # Явный URL для docker login (иначе CLI часто ходит на https:// и падает на HTTP registry)
    REGISTRY_HTTP_URL: "http://192.168.1.108:5051"

stages:
    - build
    - deploy

cache:
    paths:
      - .cache/pip
    key: "$CI_COMMIT_REF_SLUG"

build_job:
    stage: build
    image: docker:latest
    services:
      - name: docker:dind
        alias: docker
        command:
          - "--insecure-registry=192.168.1.108:5051"
    before_script:
      - echo "$REGISTRY_PASSWORD" | docker login -u "ism" --password-stdin "$REGISTRY_HTTP_URL"
      - docker run --privileged --rm tonistiigi/binfmt --install all
      - docker buildx rm multiarch || true
      - docker buildx create --use --name multiarch
      - docker buildx inspect --bootstrap
    script:
      - docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --sbom=false --build-arg BUILDKIT_INLINE_CACHE=1 -t "$IMAGE_NAME" -t "$LATEST_IMAGE" --push .
    tags:
      - runner1
    variables:
      DOCKER_BUILDKIT: 1
    only:
      - master
      - develop

deploy_job:
    stage: deploy
    image: alpine:latest
    before_script:
      - apk add --no-cache openssh-client
      - eval $(ssh-agent -s)
      - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
      - mkdir -p ~/.ssh
      - chmod 700 ~/.ssh
      - ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
    script:
      # Пароль подставляет runner; на удалённой машине только docker login
      - ssh "ism@${DEPLOY_SSH_HOST}" "set -e && echo \"🚀 Деплой...\" && echo \"${REGISTRY_PASSWORD}\" | docker login -u ism --password-stdin http://192.168.1.108:5051 && cd /home/ism/PatchBot/patchbot && docker compose pull && docker compose up -d --force-recreate && (docker image prune -af --filter \"until=24h\" || true) && echo \"✅ Готово\""
    tags:
      - runner1
    only:
      - master
    when: on_success
    needs:
      - build_job
