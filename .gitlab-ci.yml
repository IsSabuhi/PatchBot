variables:
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: ""

stages:
  - build

build_job:
  stage: build
  image: docker:latest 
  services:
    - docker:dind      
  privileged: true      
  before_script:  
    - echo "$PASS" | docker login -u "$USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME" .
  tags:
    - runner1