variables:
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"

stages:
  - build

build_job:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      command:
        - --insecure-registry=192.168.0.108:8883
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "http://$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
  tags:
    - runner1