# Образ = CI_REGISTRY_IMAGE. HTTP registry:
# 1) /etc/docker/daemon.json на раннере: "insecure-registries": ["192.168.1.108:5051"]
# 2) buildkit.toml: только http = true (plain HTTP). С insecure = true одновременно нельзя — иначе снова HTTPS.
# Раннер: privileged = true, volumes = ["/var/run/docker.sock:/var/run/docker.sock", ...]
variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    LATEST_IMAGE: "$CI_REGISTRY_IMAGE:latest"
    DEPLOY_SSH_HOST: "192.168.1.107"
    REGISTRY_HTTP_URL: "http://192.168.1.108:5051"

stages:
    - build
    - deploy

cache:
    paths:
      - .cache/pip
    key: "$CI_COMMIT_REF_SLUG"

build_job:
    stage: build
    image: docker:latest
    # Не используем services: docker:dind — конфликт сокета + HTTP registry без insecure на dind
    variables:
        DOCKER_HOST: "unix:///var/run/docker.sock"
        DOCKER_TLS_CERTDIR: ""
        DOCKER_BUILDKIT: "1"
    before_script:
      - docker info
      - echo "$REGISTRY_PASSWORD" | docker login -u "ism" --password-stdin "$REGISTRY_HTTP_URL"
      - docker run --privileged --rm tonistiigi/binfmt --install all
      # Plain HTTP registry: только http=true (с insecure=true в одной секции BuildKit ведёт себя неверно)
      - printf '%s\n' '[registry."'"${CI_REGISTRY}"'"]' 'http = true' > buildkit.toml
      - cat buildkit.toml
      - docker buildx rm multiarch || true
      - docker buildx create --use --name multiarch --driver docker-container --config buildkit.toml
      - docker buildx inspect --bootstrap
    script:
      - docker buildx build --platform linux/arm64,linux/amd64 --provenance=false --sbom=false --build-arg BUILDKIT_INLINE_CACHE=1 -t "$IMAGE_NAME" -t "$LATEST_IMAGE" --push .
    tags:
      - runner1
    only:
      - master
      - develop

deploy_job:
    stage: deploy
    image: alpine:latest
    before_script:
      - apk add --no-cache openssh-client
      - eval $(ssh-agent -s)
      - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
      - mkdir -p ~/.ssh
      - chmod 700 ~/.ssh
      - ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
    script:
      - ssh "ism@${DEPLOY_SSH_HOST}" "set -e && echo \"🚀 Деплой...\" && echo \"${REGISTRY_PASSWORD}\" | docker login -u ism --password-stdin http://192.168.1.108:5051 && cd /home/ism/PatchBot/patchbot && docker compose pull && docker compose up -d --force-recreate && (docker image prune -af --filter \"until=24h\" || true) && echo \"✅ Готово\""
    tags:
      - runner1
    only:
      - master
    when: on_success
    needs:
      - build_job
