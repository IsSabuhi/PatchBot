variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    LATEST_IMAGE: "$CI_REGISTRY_IMAGE:latest"

stages:
    - build
    - deploy

cache:
    paths:
      - .cache/pip
    key: "$CI_COMMIT_REF_SLUG"

build_job:
    stage: build
    image: docker:latest
    services:
      - name: docker:dind
        command:
          - --insecure-registry=192.168.0.108:5051
    before_script:
      - echo "$REGISTRY_PASSWORD" | docker login -u "ism" --password-stdin "http://$CI_REGISTRY"
    script:
      - docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t "$IMAGE_NAME" .
      - docker push "$IMAGE_NAME"
    tags:
      - runner1
    variables:
      DOCKER_BUILDKIT: 1  

deploy_job:
    stage: deploy
    image: alpine:latest
    before_script:
      - apk add --no-cache openssh-client
      - eval $(ssh-agent -s)
      - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
      - mkdir -p ~/.ssh
      - chmod 700 ~/.ssh
      - ssh-keyscan -H 192.168.0.107 >> ~/.ssh/known_hosts
    script:
      - ssh ism@192.168.0.107 "
          echo '🔄 Обновление бота...' &&
          docker login -u ism -p '$REGISTRY_PASSWORD' http://192.168.0.108:5051 &&
          cd ~/PatchBot/patchbot &&
          docker pull $LATEST_IMAGE &&
          docker stop patchbot || true &&
          docker rm patchbot || true &&
          docker run -d \
            --name patchbot \
            --restart always \
            --env-file .env \
            $LATEST_IMAGE &&
          echo '✅ Деплой завершен успешно'
        "
    tags:
      - runner1
    only:
      - master
    when: on_success
    needs:
      - build_job